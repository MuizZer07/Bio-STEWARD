name: ci
# Paused 2026-11-23: the GitHub Actions free minutes for this month are used up and there is no budget for more.
# Until December 2026 CI runs only when started by hand (Actions tab, "Run workflow"). Restore by putting back:
#   push:
#   pull_request:
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python tools/lint_language.py
      - run: python tools/regenerate_schemas.py --check
      - run: steward check --final --summary --repo examples/toy-expression-benchmark
      - run: python -m pip install build && python -m build -o dist
      - run: steward release audit --dist dist
      - run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install dist/*.whl
          mkdir /tmp/proj && cd /tmp/proj && /tmp/clean/bin/steward init --skills .agents/skills --paper
          test -f .agents/skills/using-steward/SKILL.md
      - run: python tools/measure_footprint.py --check
