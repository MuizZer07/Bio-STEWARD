# Benchmark contract for the toy expression benchmark (fictional, synthetic data).
schema   = "steward.contract/0.1"
id       = "expr-clf"
title    = "Responder classification from synthetic expression profiles"
analysis = "confirmatory"

[[datasets]]
id      = "toy-expression"
version = "1"
sha256  = "8e74100e93ac4830be76b1e8d342d534bec629774da6db9a82da29d8f98c3f13"
source  = "data/expression.csv (generated by make_data.py, seed 20261123)"

[splits]
group_key = "donor_id"     # three samples per donor; a donor must never appear in two splits
time_key  = "none"
# one row per sample (sample_id, donor_id): R-45 checks donor overlap across splits
metadata  = "data/samples.csv"
id_column = "sample_id"

[[splits.sets]]
name     = "train"
role     = "train"
ids_file = "benchmarks/splits/train.txt"

[[splits.sets]]
name     = "validation"
role     = "validation"
ids_file = "benchmarks/splits/validation.txt"

[[splits.sets]]
name     = "test"
role     = "test"
ids_file = "benchmarks/splits/test.txt"

[[baselines]]
name      = "majority-class"
reference = "internal"
version   = "1"

[[baselines]]
name      = "logistic-regression"
reference = "internal"
version   = "1"

[metrics]
primary = "auroc"

[[metrics.defs]]
name           = "auroc"
definition     = "Area under the ROC curve on the test split, per sample"
implementation = "analysis/metrics.py"

[comparison]
method    = "paired_bootstrap_ci"
seed      = 20261123
resamples = 2000
alpha     = 0.05

[[thresholds]]
metric     = "auroc"
comparator = ">="
value      = 0.05
against    = "baseline:logistic-regression"   # the candidate must exceed logistic regression by at least 0.05 AUROC

[exclusions]
rules = []

[outputs]
required = ["results/metrics.json"]

# Leakage that sample IDs and metadata cannot reveal (R-49): each type is declared, and a declaration is recorded,
# not verified. This example is at stage 1: data and splits exist, no model is trained yet.
[leakage]
near_duplicate    = { status = "not_applicable", reason = "synthetic profiles drawn independently per sample; a donor's shared offset is handled by the donor split" }
batch_confounding = { status = "checked", evidence = "make_data.py", reason = "batch is assigned independently of the label by construction" }
preprocessing_fit = { status = "not_applicable", reason = "no preprocessing or model exists yet (stage 1)" }
label_leakage     = { status = "not_applicable", reason = "no features are derived yet (stage 1)" }
test_tuning       = { status = "not_applicable", reason = "no hyperparameters are tuned yet (stage 1)" }
undeclared_groups = { status = "checked", evidence = "make_data.py", reason = "donor and batch are the only structure the generator creates" }
test_reuse        = { status = "not_applicable", reason = "a new synthetic test split, not used in earlier comparisons" }
