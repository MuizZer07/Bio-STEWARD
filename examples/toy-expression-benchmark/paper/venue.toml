# Venue profile for the example: a generic preprint (fictional source on the reserved example.org domain).
schema     = "steward.venue/0.1"
name       = "Generic preprint server (example)"
kind       = "preprint"
source_url = "url:https://example.org/fictional/preprint-guidelines"
