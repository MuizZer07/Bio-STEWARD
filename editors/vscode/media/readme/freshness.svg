<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13">
<rect width="900" height="374" rx="10" fill="#1f1f1f"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#75beff"/></marker></defs>
<rect x="40" y="40" width="220" height="96" rx="48" fill="#252526" stroke="#89d185" stroke-width="2"/>
<text x="150" y="78" fill="#89d185" font-weight="700" font-size="17" text-anchor="middle">fresh</text>
<text x="150" y="100" fill="#9d9d9d" font-size="12" text-anchor="middle">no project file changed</text>
<text x="150" y="116" fill="#9d9d9d" font-size="12" text-anchor="middle">since this run</text>
<rect x="640" y="40" width="220" height="96" rx="48" fill="#252526" stroke="#cca700" stroke-width="2"/>
<text x="750" y="78" fill="#cca700" font-weight="700" font-size="17" text-anchor="middle">stale</text>
<text x="750" y="100" fill="#9d9d9d" font-size="12" text-anchor="middle">run check again</text>
<rect x="340" y="230" width="220" height="96" rx="48" fill="#252526" stroke="#75beff" stroke-width="2"/>
<text x="450" y="268" fill="#75beff" font-weight="700" font-size="17" text-anchor="middle">unknown</text>
<text x="450" y="290" fill="#9d9d9d" font-size="12" text-anchor="middle">the extension cannot tell</text>
<line x1="262" y1="74" x2="638" y2="74" stroke="#75beff" stroke-width="1.6" marker-end="url(#a)"/>
<text x="450" y="66" fill="#75beff" font-size="11.5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">a file changed · the CLI changed · a scoped run</text>
<line x1="638" y1="112" x2="262" y2="112" stroke="#75beff" stroke-width="1.6" marker-end="url(#a)"/>
<text x="450" y="130" fill="#75beff" font-size="11.5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">Run Check (a full run)</text>
<polyline points="400,230 400,190 150,190 150,138" fill="none" stroke="#75beff" stroke-width="1.6" marker-end="url(#a)"/>
<text x="275" y="184" fill="#75beff" font-size="11.5" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">Run Check</text>
<text x="660" y="270" fill="#9d9d9d" font-size="12">unknown when:</text>
<text x="660" y="290" fill="#9d9d9d" font-size="12">· a report found at start-up</text>
<text x="660" y="308" fill="#9d9d9d" font-size="12">· a file changed during the run</text>
<text x="40" y="270" fill="#9d9d9d" font-size="12">File changes only ever downgrade.</text>
<text x="40" y="290" fill="#9d9d9d" font-size="12">.steward/ and git's bookkeeping do not count.</text>
<text x="40" y="308" fill="#9d9d9d" font-size="12">"current" is never shown on CLI 0.20.6.</text>
<text x="16" y="362" font-size="11.5" fill="#8b949e">Freshness of the report the views show: three words, and what moves between them.</text>
</svg>
