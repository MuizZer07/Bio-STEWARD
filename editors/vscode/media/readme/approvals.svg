<text x="16" y="1220" font-size="11.5" fill="#8b949e">Drawing of the Approvals panel: the page its view model builds from the fixture text of steward authorize pending</text>
<text x="16" y="1236" font-size="11.5" fill="#8b949e">--all-projects, one card per payload line, with the fields of authorize pending --format json (not a screenshot). The baselines</text>
<text x="16" y="1252" font-size="11.5" fill="#8b949e">and the CLI's payload hashes are normalised to zeros in the fixture, which has no payload files, so the hash read from the file</text>
<text x="16" y="1268" font-size="11.5" fill="#8b949e">is a placeholder naming the file the panel hashes; each action's colour icon is drawn as a plain mark (¤ for spend). The peer's</text>
<text x="16" y="1284" font-size="11.5" fill="#8b949e">payload has no buttons.</text>
