<text x="24" y="86" fill="#9d9d9d" font-size="12">--format json. The payload and the SHA-256 that ✍ Sign shows are read from the file</text>
<text x="24" y="104" fill="#9d9d9d" font-size="12">.steward/pending/&lt;nonce&gt;.txt.</text>
