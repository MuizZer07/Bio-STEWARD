<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" role="img" aria-label="Two sample designs. On the left, conditions control and case each have samples in batches B1 and B2, so the conditions connect through shared batches: R-75 passes, with an advisory if one condition's share differs by 80 percentage points or more between batches. On the right, control occurs only in B1 and case only in B2, so the conditions form separate groups: R-75 fails with R-75.sample_confounding.">
  <style>
    .bg { fill: #f6f8fb; } .box { fill: #ffffff; stroke: #c7cfdc; stroke-width: 1.5; } .ink { fill: #1d2330; }
    .muted { fill: #5b6475; } .line { stroke: #8792a6; stroke-width: 1.6; fill: none; }
    .done { fill: #e3f4e8; stroke: #3d9a5b; stroke-width: 1.5; } .fail { fill: #fbe7e7; stroke: #c44b4b; stroke-width: 1.5; }
    .run { fill: #e6eefb; stroke: #4a72c4; stroke-width: 1.5; } .panel { fill: none; stroke: #c7cfdc; stroke-width: 1; stroke-dasharray: 4 4; }
    .edge-ok { stroke: #3d9a5b; stroke-width: 2.2; fill: none; } .edge-bad { stroke: #c44b4b; stroke-width: 2.2; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f1219; } .box { fill: #171b25; stroke: #3a4254; } .ink { fill: #e6e9ef; } .muted { fill: #9aa3b5; }
      .line { stroke: #6b768b; } .panel { stroke: #3a4254; }
      .done { fill: #13301d; stroke: #4caf6e; } .fail { fill: #3a1818; stroke: #d06060; } .run { fill: #172440; stroke: #5b86d6; }
      .edge-ok { stroke: #4caf6e; } .edge-bad { stroke: #d06060; }
    }
    text { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; }
    .small { font-size: 12.5px; } .title { font-size: 16px; font-weight: 600; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="330" rx="14"/>

  <!-- left: connected -->
  <rect class="panel" x="20" y="16" width="450" height="298" rx="10"/>
  <text class="ink title" x="245" y="44" text-anchor="middle">Connected: conditions share batches</text>
  <text class="muted small" x="110" y="74" text-anchor="middle">condition</text>
  <text class="muted small" x="380" y="74" text-anchor="middle">batch</text>
  <rect class="run" x="50" y="90" width="120" height="40" rx="10"/><text class="ink" x="110" y="115" text-anchor="middle">control</text>
  <rect class="run" x="50" y="170" width="120" height="40" rx="10"/><text class="ink" x="110" y="195" text-anchor="middle">case</text>
  <rect class="box" x="320" y="90" width="120" height="40" rx="10"/><text class="ink" x="380" y="115" text-anchor="middle">B1</text>
  <rect class="box" x="320" y="170" width="120" height="40" rx="10"/><text class="ink" x="380" y="195" text-anchor="middle">B2</text>
  <path class="edge-ok" d="M170,110 H320"/><text class="muted small" x="245" y="104" text-anchor="middle">4</text>
  <path class="edge-ok" d="M170,110 L320,190"/><text class="muted small" x="206" y="140" text-anchor="middle">3</text>
  <path class="edge-ok" d="M170,190 L320,110"/><text class="muted small" x="284" y="140" text-anchor="middle">3</text>
  <path class="edge-ok" d="M170,190 H320"/><text class="muted small" x="245" y="206" text-anchor="middle">4</text>
  <rect class="done" x="50" y="236" width="390" height="62" rx="10"/>
  <text class="ink" x="245" y="261" text-anchor="middle">PASS: each contrast is separable from batch</text>
  <text class="muted small" x="245" y="284" text-anchor="middle">advisory R-75.sample_imbalance if a share differs ≥ 80 points</text>

  <!-- right: disconnected -->
  <rect class="panel" x="490" y="16" width="450" height="298" rx="10"/>
  <text class="ink title" x="715" y="44" text-anchor="middle">Disconnected: condition equals batch</text>
  <text class="muted small" x="580" y="74" text-anchor="middle">condition</text>
  <text class="muted small" x="850" y="74" text-anchor="middle">batch</text>
  <rect class="run" x="520" y="90" width="120" height="40" rx="10"/><text class="ink" x="580" y="115" text-anchor="middle">control</text>
  <rect class="run" x="520" y="170" width="120" height="40" rx="10"/><text class="ink" x="580" y="195" text-anchor="middle">case</text>
  <rect class="box" x="790" y="90" width="120" height="40" rx="10"/><text class="ink" x="850" y="115" text-anchor="middle">B1</text>
  <rect class="box" x="790" y="170" width="120" height="40" rx="10"/><text class="ink" x="850" y="195" text-anchor="middle">B2</text>
  <path class="edge-bad" d="M640,110 H790"/><text class="muted small" x="715" y="104" text-anchor="middle">7</text>
  <path class="edge-bad" d="M640,190 H790"/><text class="muted small" x="715" y="206" text-anchor="middle">7</text>
  <rect class="fail" x="520" y="236" width="390" height="62" rx="10"/>
  <text class="ink" x="715" y="261" text-anchor="middle">FAIL: R-75.sample_confounding</text>
  <text class="muted small" x="715" y="284" text-anchor="middle">the condition effect cannot be told from the batch effect</text>
</svg>
