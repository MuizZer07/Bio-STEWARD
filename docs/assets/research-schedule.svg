<desc id="schedule-desc">17 dated events from 2026-11-03 to 2027-01-16; today is 2026-11-28. Lanes: Milestones 5, Sprints 1, Sprint tasks 3, Releases 2, Decisions 3, Research 2, Papers and reviews 1. Coming deadlines: Preprint of the reanalysis due 2026-12-12, internal deadline 2026-12-08, first due 2026-11-28, on track; Journal submission due 2027-01-16, internal deadline 2027-01-09, on track. Newest first: 2027-01-16 11:59 milestone Journal submission; 2026-12-12 23:59 milestone Preprint of the reanalysis; 2026-11-26 decision add a sensitivity analysis on age; 2026-11-25 09:00 task analysis-1 T3: Sensitivity analysis; 2026-11-25 paper paper main: venue requirements retrieved (Generic preprint server (example)); 2026-11-24 12:00 release release v0.2.0; 2026-11-19 09:00 task analysis-1 T2: Differential expression; 2026-11-16 09:00 task analysis-1 T1: Probe-to-gene mapping; 2026-11-16 08:00 sprint sprint analysis-1; 2026-11-14 15:00 milestone_moved preprint moved: 2026-11-28 → 2026-12-12 (Preprint of the reanalysis); 2026-11-14 decision move the preprint by two weeks; 2026-11-12 16:00 milestone Lab meeting talk; 2026-11-12 milestone_outcome lab-talk: met (2026-11-12: talk given); 2026-11-10 12:00 release release v0.1.0; 2026-11-06 research review lit-pd-sn: Substantia nigra expression studies; 2026-11-05 research lit-pd-sn: literature searched; 2026-11-03 decision use the GEO series matrix as the only input.</desc>
